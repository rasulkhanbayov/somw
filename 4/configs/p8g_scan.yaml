# Pilot E1b (Oct 19, 2026; EXPLORATORY; PLAN.md "Pilot E1b"): the stiff-material regime. exhaustive coarse_cfl m = 4 window scan (base)
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${BIG_ROOT}/datasets/stiff_e1
  gen_dir: ${BIG_ROOT}/generations
reference_cfl: 0.3          # CFL-safe reference for very stiff materials (backend option, off by default elsewhere)
run_name: p8g_scan
include_test_id: false
query_runs: [p8g_build]
n_id_queries: 0
n_ood_per_split: 75
models: [base]
include_gt: false
ms: [4]
fidelities:
  coarse_cfl: {substep_dt: 8.0e-4, n_grid: 64, cfl_target: 0.5}
lift: {k: 12, lam: 1.0e-6, use_F: false, use_C: true}
cfl_gate: 1.15
seed: 0
