# Phase 4d data: the fallback simulation of certify-or-simulate (pre-registered Oct 12, 2026).
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${DATA_ROOT}/ood
  gen_dir: ${DATA_ROOT}/generations
run_name: p4d_fullsim
entry_sets:
  - {include_test_id: true, query_runs: [p2_build_ood], n_id_queries: 100, n_ood_per_split: 50}       # Phase 2c
  - {include_test_id: false, query_runs: [p4_calib_build, p4_calib2_build], n_id_queries: 0, n_ood_per_split: 100}  # calibration
fidelities:
  coarse_cfl: {substep_dt: 8.0e-4, n_grid: 64, cfl_target: 0.5}   # the fallback
sim_mode: nosync
