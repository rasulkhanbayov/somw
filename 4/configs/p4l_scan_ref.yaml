# Phase 4l-ref: the pre-registered H0 follow-up (PLAN.md "Phase 4l-ref"). Same scan as p4l_scan.yaml,
# at PhysCtrl's reference setting.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  gen_dir: ${BIG_ROOT}/generations
run_name: p4l_scan_ref
include_test_id: false
query_runs: [p4l_scene_build]
n_id_queries: 0
n_ood_per_split: 50
models: [base, gt_super]
include_gt: true
ms: [4]
fidelities:
  ref: {}
lift: {k: 12, lam: 1.0e-6, use_F: false, use_C: true}
seed: 0
