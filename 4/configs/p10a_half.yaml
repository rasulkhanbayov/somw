# Phase 10a (pre-registered Oct 20, 2026; PLAN.md "Phase 10"): is the reference converged? The reference setting (grid 125) at a
# smaller time step; err_t is the distance to the stored reference. No CFL cap: the step is used as given and divides the frame exactly.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${BIG_ROOT}/datasets/p9
  gen_dir: ${BIG_ROOT}/generations
run_name: p10a_half
entry_sets:
  - {include_test_id: false, query_runs: [p9_build], n_id_queries: 0, n_ood_per_split: 100}
fidelities:
  half: {substep_dt: 5.0e-5, n_grid: 125}
sim_mode: nosync
