# Phase 4l: true error and seed spread of the composed sources (base: 8 samples; gt_super: 1).
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  gen_dir: ${BIG_ROOT}/generations
run_name: p4l_errors
include_test_id: false
query_runs: [p4l_scene_build]
n_id_queries: 0
n_ood_per_split: 50
models: [base, gt_super]
n_samples: 8
seed: 0
probe:
  strategies: []
  n_windows: 3
  m: 1
  n_perturb: 0
  lift: {k: 12, lam: 1.0e-6, use_F: false, use_C: true}
  perturb: {pos_eps_dx: 0.05, vel_rel: 0.05, logE_sd: 0.05, sigma_floor: 1.0e-4}
  seed: 0
