# Phase 9 (pre-registered Oct 19, 2026; PLAN.md "Phase 9"): confirmation of ours-v2 on fresh data. ours-v2 repairs: M1 shadow from the true start, M2 suffix at every chain point.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${BIG_ROOT}/datasets/p9
  gen_dir: ${BIG_ROOT}/generations
run_name: p9_allk
entry_sets:
  - {include_test_id: false, query_runs: [p9_build], n_id_queries: 0, n_ood_per_split: 100}
chain_k: [3, 7, 11, 15, 19]
shadow_fidelity: {substep_dt: 8.0e-4, n_grid: 96, cfl_target: 0.5}
restart_fidelity: {substep_dt: 4.0e-4, n_grid: 96, cfl_target: 0.5}
