# Phase 4g-v2 (pre-registered and frozen Oct 13, 2026; see PLAN.md "Phase 4g-v2"): base frozen,
# temporal-attention LoRA + known-frame embedding, distillation to the frozen base. Same data as v1.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  ckpt_root: ${DATA_ROOT}/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${DATA_ROOT}/fc_train
  gen_dir: ${DATA_ROOT}/generations
run_name: p4g_train_v2
ckpt_name: fc_base_v2
train_build_runs: [p4g_train_build]
base_manifest: ${PROJECT_ROOT}/results/p4g_sample_manifest/manifest.json
seed: 0
train:
  mode: lora
  steps: 10000
  batch_size: 8
  lr: 1.0e-4
  warmup: 100
  lambda_vel: 1.0
  lambda_distill: 1.0
  val_frac: 0.05            # held-out training objects; logged only, never used to pick a checkpoint
  val_samples: 64
  num_workers: 6
  log_every: 100
  val_every: 1000
  ckpt_every: 2500
mask: {window: 4, p_none: 0.1, p_anchor: 0.7, max_windows: 3}
lora: {rank: 8, alpha: 8.0, target: attn_temp}
