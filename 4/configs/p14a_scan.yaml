# Phase 14a (pre-registered Oct 22, 2026; PLAN.md "Phase 14"): coarse_cfl m = 4 scan of the candidate pool (the one-window certificate is read from it on CPU).
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${BIG_ROOT}/datasets/p14a
  gen_dir: ${BIG_ROOT}/generations
run_name: p14a_scan
include_test_id: false
query_runs: [p14a_build]
n_id_queries: 0
n_ood_per_split: 100
models: [base]
include_gt: false
ms: [4]
fidelities:
  coarse_cfl: {substep_dt: 8.0e-4, n_grid: 64, cfl_target: 0.5}
lift: {k: 12, lam: 1.0e-6, use_F: false, use_C: true}
cfl_gate: 1.15
seed: 0
