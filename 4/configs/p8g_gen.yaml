# Pilot E1b (Oct 19, 2026; EXPLORATORY; PLAN.md "Pilot E1b"): the stiff-material regime. generations (8 samples); probe errors on CPU afterwards
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${BIG_ROOT}/datasets/stiff_e1
  gen_dir: ${BIG_ROOT}/generations
reference_cfl: 0.3          # CFL-safe reference for very stiff materials (backend option, off by default elsewhere)
generate_run_name: p8g_generate
run_name: p8g_errors
include_test_id: false
query_runs: [p8g_build]
n_id_queries: 0
n_ood_per_split: 75
models: [base]
n_samples: 8
seed: 0
probe:
  strategies: []
  n_windows: 3
  m: 1
  n_perturb: 0
  lift: {k: 12, lam: 1.0e-6, use_F: false, use_C: true}
  perturb: {pos_eps_dx: 0.05, vel_rel: 0.05, logE_sd: 0.05, sigma_floor: 1.0e-4}
  seed: 0
