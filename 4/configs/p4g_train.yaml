# Phase 4g fine-tune (pre-registered and frozen Oct 12, 2026; see PLAN.md "Phase 4g").
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  ckpt_root: ${DATA_ROOT}/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${DATA_ROOT}/fc_train
  gen_dir: ${DATA_ROOT}/generations
run_name: p4g_train
ckpt_name: fc_base_v1
train_build_runs: [p4g_train_build]
base_manifest: ${PROJECT_ROOT}/results/p4g_sample_manifest/manifest.json
seed: 0
train:
  steps: 20000
  batch_size: 8
  lr: 5.0e-5
  warmup: 100
  lambda_vel: 1.0
  val_frac: 0.05            # held-out training objects; logged only, never used to pick a checkpoint
  val_samples: 64
  num_workers: 6
  log_every: 100
  val_every: 1000
  ckpt_every: 2500
mask: {window: 4, p_none: 0.1, p_anchor: 0.7, max_windows: 3}
