# Phase 4l: exhaustive coarse_cfl m = 4 scan for base, gt_super and gt (the lift floor, H0).
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  gen_dir: ${BIG_ROOT}/generations
run_name: p4l_scan
include_test_id: false
query_runs: [p4l_scene_build]
n_id_queries: 0
n_ood_per_split: 50
models: [base, gt_super]
include_gt: true
ms: [4]
fidelities:
  coarse_cfl: {substep_dt: 8.0e-4, n_grid: 64, cfl_target: 0.5}
lift: {k: 12, lam: 1.0e-6, use_F: false, use_C: true}
cfl_gate: 1.15
seed: 0
