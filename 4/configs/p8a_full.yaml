# Pilot 8a part A (Oct 17, 2026; EXPLORATORY, development data; PLAN.md "Pilots 8a and 8b"): full rollouts
# from the true initial state at three medium CFL-adaptive fidelities, on the 2c pool and the 4l scenes.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${DATA_ROOT}/ood
  gen_dir: ${DATA_ROOT}/generations
run_name: p8a_full
entry_sets:
  - {include_test_id: true, query_runs: [p2_build_ood], n_id_queries: 100, n_ood_per_split: 50}       # Phase 2c
  - {include_test_id: false, query_runs: [p4l_scene_build], n_id_queries: 0, n_ood_per_split: 50}     # Phase 4l scenes
fidelities:
  M1: {substep_dt: 8.0e-4, n_grid: 96, cfl_target: 0.5}
  M2: {substep_dt: 4.0e-4, n_grid: 96, cfl_target: 0.5}
  M3: {substep_dt: 2.0e-4, n_grid: 125, cfl_target: 0.5}
sim_mode: nosync
