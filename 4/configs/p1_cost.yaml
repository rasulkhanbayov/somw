# Phase 1a: generation vs simulation wall-clock on one GPU type (run on A100 and H200).
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${DATA_ROOT}/ood
  gen_dir: ${DATA_ROOT}/generations
n_queries: 5                # elastic test queries loaded (regimes take the first 1-3)
generation:
  models: [base, large]
  n_queries: 3
  batch_sizes: [1, 8, 31]   # 31 = most samples per call: 32 x 2,048 points exceeds the SDPA launch limit (physctrl_bridge.MAX_ATTN_SEQUENCES)
  reps: 5
  warmup: 2
simulation:
  regimes: [physctrl, dense10x, dense10x_fine, multiobj2, multiobj3]
  modes: [as_is, nosync, graph]
  n_queries: 3              # each regime timed on 3 different object draws
probes:
  n_queries: 3
  m_model_frames: [1, 2]    # window = 2m simulator frames
  reps: 3
