# Phase 4m: V2 at every restart point + coarse-only rollout with saved positions, fresh queries.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${DATA_ROOT}/fresh4m
  gen_dir: ${DATA_ROOT}/generations
run_name: p4m_allk
entry_sets:
  - {include_test_id: false, query_runs: [p4m_build], n_id_queries: 0, n_ood_per_split: 100}
chain_k: [3, 7, 11, 15, 19]
shadow_fidelity: {substep_dt: 8.0e-4, n_grid: 64, cfl_target: 0.5}
shadow_to_end: true
save_coarse_dir: ${DATA_ROOT}/coarse_traj
