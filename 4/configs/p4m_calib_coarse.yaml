# Phase 4m: coarse_cfl rollouts WITH positions for the 1,200 calibration queries, so that the
# agreement baseline's threshold is calibrated on the same pool as every other threshold.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${DATA_ROOT}/calib
  gen_dir: ${DATA_ROOT}/generations
run_name: p4m_calib_coarse
entry_sets:
  - {include_test_id: false, query_runs: [p4_calib_build, p4_calib2_build], n_id_queries: 0, n_ood_per_split: 100}
chain_k: []                     # coarse rollout only
shadow_fidelity: {substep_dt: 8.0e-4, n_grid: 64, cfl_target: 0.5}
shadow_to_end: true
save_coarse_dir: ${DATA_ROOT}/coarse_traj
