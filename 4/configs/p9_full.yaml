# Phase 9 (pre-registered Oct 19, 2026; PLAN.md "Phase 9"): confirmation of ours-v2 on fresh data. Full rollouts for the baselines: coarse only and the tuned simulators M1/M2/M3.
paths:
  data_root: ${DATA_ROOT}
  ckpt_dir: ${DATA_ROOT}/checkpoints/checkpoints
  testset_dir: ${DATA_ROOT}/testset
  ood_dir: ${BIG_ROOT}/datasets/p9
  gen_dir: ${BIG_ROOT}/generations
run_name: p9_full
entry_sets:
  - {include_test_id: false, query_runs: [p9_build], n_id_queries: 0, n_ood_per_split: 100}
fidelities:
  coarse_cfl: {substep_dt: 8.0e-4, n_grid: 64, cfl_target: 0.5}
  M1: {substep_dt: 8.0e-4, n_grid: 96, cfl_target: 0.5}
  M2: {substep_dt: 4.0e-4, n_grid: 96, cfl_target: 0.5}
  M3: {substep_dt: 2.0e-4, n_grid: 125, cfl_target: 0.5}
sim_mode: nosync
